<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account | Quantum Vault</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
    <main class="auth-card">
        <h1>Quantum Vault</h1>
        <p>Create your password manager account.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p class="notice">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="post" action="{{ url_for('register') }}">
            <label for="username">Username</label>
            <input id="username" name="username" required maxlength="80"
                   autocomplete="username">

            <label for="email">Email</label>
            <input id="email" name="email" type="email" required
                   maxlength="255" autocomplete="email">

            <label for="master_password">Master password</label>
            <input id="master_password" name="master_password"
                   type="password" required minlength="12"
                   autocomplete="new-password">

            <button type="submit">Create account</button>
        </form>

        <p>Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
    </main>
</body>
</html>
